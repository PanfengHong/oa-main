name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

# 允许 Pages 部署
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout oa-main
        uses: actions/checkout@v5
        with:
          path: oa-main

      # 各业务子包是独立仓库，需分别拉取到与 oa-main 同级目录，
      # 这样 oa-main 的 build:deps（--prefix ../oa-xxx）与 vite alias 才能解析到。
      - name: Checkout sibling packages
        uses: actions/checkout@v5
        with:
          repository: PanfengHong/oa-utils
          path: oa-utils
      - uses: actions/checkout@v5
        with:
          repository: PanfengHong/oa-auth
          path: oa-auth
      - uses: actions/checkout@v5
        with:
          repository: PanfengHong/oa-form
          path: oa-form
      - uses: actions/checkout@v5
        with:
          repository: PanfengHong/oa-designer
          path: oa-designer
      - uses: actions/checkout@v5
        with:
          repository: PanfengHong/oa-flow
          path: oa-flow
      - uses: actions/checkout@v5
        with:
          repository: PanfengHong/oa-meeting
          path: oa-meeting
      - uses: actions/checkout@v5
        with:
          repository: PanfengHong/oa-task
          path: oa-task
      - uses: actions/checkout@v5
        with:
          repository: PanfengHong/oa-project
          path: oa-project
      - uses: actions/checkout@v5
        with:
          repository: PanfengHong/oa-chat
          path: oa-chat

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            oa-main/package-lock.json
            oa-utils/package-lock.json
            oa-auth/package-lock.json
            oa-form/package-lock.json
            oa-designer/package-lock.json
            oa-flow/package-lock.json
            oa-meeting/package-lock.json
            oa-task/package-lock.json
            oa-project/package-lock.json
            oa-chat/package-lock.json

      - name: Install & build sibling packages
        working-directory: oa-main
        env:
          # 部署到 GitHub Pages 时强制使用模拟数据
          VITE_USE_MOCK: 'true'
          # 仓库名为 oa-main，Pages 子路径为 /oa-main/
          VITE_BASE_PATH: /oa-main/
        run: |
          npm install
          # build:deps 会构建 ../oa-auth 等所有子包（每个子包需先 install）
          for d in oa-utils oa-auth oa-form oa-designer oa-flow oa-meeting oa-task oa-project oa-chat; do
            (cd "../$d" && npm install)
          done
          npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: oa-main/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
